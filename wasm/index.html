<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pin</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    width: min(100vw, calc(100vh * 240 / 135));
    image-rendering: pixelated;
  }
  #text-input {
    position: fixed;
    left: 0;
    top: 0;
    width: 1px;
    height: 1px;
    opacity: 0;
    font-size: 16px;
  }
  #pad, #symbols { display: none; }
  #pad button, #symbols button {
    min-width: 44px;
    height: 44px;
    border: 1px solid #f0501a;
    border-radius: 6px;
    background: #241604;
    color: #f4e8d0;
    font: 16px monospace;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  #pad button.pressed, #symbols button.pressed { background: #f0501a; color: #000; }
  @media (pointer: coarse) {
    body { flex-direction: column; justify-content: center; }
    body.text-input {
      position: fixed;
      left: 0;
      right: 0;
      top: var(--viewport-top, 0px);
      height: var(--viewport-height, 100vh);
      box-sizing: border-box;
      padding: 16px 0;
      gap: 12px;
    }
    canvas { width: 100vw; }
    #pad {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-sizing: border-box;
      width: 100%;
      padding: 16px;
    }
    #arrows {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(3, 48px);
      gap: 4px;
    }
    #arrows button { width: 48px; height: 48px; }
    #arrows [data-key="ArrowUp"] { grid-area: 1 / 2; }
    #arrows [data-key="ArrowLeft"] { grid-area: 2 / 1; }
    #arrows [data-key="ArrowRight"] { grid-area: 2 / 3; }
    #arrows [data-key="ArrowDown"] { grid-area: 3 / 2; }
    #keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    body.text-input canvas {
      width: min(100vw, calc((var(--viewport-height, 100vh) - 120px) * 240 / 135));
    }
    body.text-input #pad { display: none; }
    body.text-input #symbols {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
      box-sizing: border-box;
      width: 100%;
      padding: 0 8px;
    }
    #symbols button { min-width: 0; height: 36px; padding: 0; }
  }
</style>
</head>
<body>
<canvas id="canvas" width="240" height="135"></canvas>
<input id="text-input" type="text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
<div id="pad">
  <div id="arrows">
    <button data-key="ArrowUp">▲</button>
    <button data-key="ArrowLeft">◀</button>
    <button data-key="ArrowRight">▶</button>
    <button data-key="ArrowDown">▼</button>
  </div>
  <div id="keys">
    <button data-key="Enter">Ent</button>
    <button data-key=" ">Spc</button>
    <button data-key="Escape">Esc</button>
    <button data-key="Backspace">BS</button>
    <button data-key="+">+</button>
    <button data-key="-">−</button>
    <button data-key="i">i</button>
    <button data-key="c">c</button>
    <button data-key="e">e</button>
    <button data-key="v">v</button>
    <button data-key="?">?</button>
    <button data-key="q">q</button>
    <button data-key="y">y</button>
    <button data-key="n">n</button>
  </div>
</div>
<div id="symbols">
  <button data-key="Escape">Esc</button>
  <button data-key=":">:</button>
  <button data-key="!">!</button>
  <button data-key="Tab">Tab</button>
  <button data-key="#">#</button>
  <button data-key="_">_</button>
  <button data-key="=">=</button>
  <button data-key="-">-</button>
  <button data-key="+">+</button>
  <button data-key="/">/</button>
  <button data-key="*">*</button>
  <button data-key="(">(</button>
  <button data-key=")">)</button>
  <button data-key="[">[</button>
  <button data-key="]">]</button>
  <button data-key="{">{</button>
  <button data-key="}">}</button>
  <button data-key="|">|</button>
  <button data-key="&quot;">"</button>
  <button data-key="'">'</button>
</div>
<script>
  const textInput = document.getElementById("text-input");

  function pressKey(key) {
    document.dispatchEvent(
      new KeyboardEvent("keydown", { key, bubbles: true, cancelable: true })
    );
  }

  for (const button of document.querySelectorAll("#pad [data-key], #symbols [data-key]")) {
    button.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      button.classList.add("pressed");
      pressKey(button.dataset.key);
    });

    for (const type of ["pointerup", "pointercancel", "pointerleave"])
      button.addEventListener(type, () => button.classList.remove("pressed"));
  }

  const coarsePointer = window.matchMedia("(pointer: coarse)");
  const viewport = window.visualViewport;

  function updateViewportHeight() {
    const height = viewport ? viewport.height : window.innerHeight;
    const top = viewport ? viewport.offsetTop : 0;

    document.documentElement.style.setProperty("--viewport-height", `${height}px`);
    document.documentElement.style.setProperty("--viewport-top", `${top}px`);
  }

  updateViewportHeight();
  (viewport || window).addEventListener("resize", updateViewportHeight);

  if (viewport)
    viewport.addEventListener("scroll", updateViewportHeight);

  document.getElementById("canvas").addEventListener("click", () => {
    if (coarsePointer.matches && document.body.classList.contains("text-input"))
      textInput.focus();
  });

  textInput.addEventListener("input", (event) => {
    if (event.inputType === "deleteContentBackward")
      pressKey("Backspace");
    else if (event.data)
      for (const character of event.data)
        pressKey(character);

    textInput.value = "";
  });
</script>
<script>
  if ("serviceWorker" in navigator)
    navigator.serviceWorker.register("sw.js");
</script>
<script src="pin.js"></script>
</body>
</html>
